<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ದೋಸ್ತಾ ರೇಡಿಯೋ</title>
<meta name="theme-color" content="#120B06"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;600;700;800&family=Noto+Sans+Kannada:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
 --w:#FFFFFF;--w72:rgba(255,255,255,.72);--w48:rgba(255,255,255,.48);
 --w26:rgba(255,255,255,.26);--w14:rgba(255,255,255,.14);
 --gold:#FFC24A;--ember:#FF6A34;
 --kn:"Baloo Tamma 2",system-ui,sans-serif;
 --nk:"Noto Sans Kannada",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--nk);color:var(--w);overflow:hidden;background:#120B06}
.bg{position:fixed;inset:0;z-index:0;
 background:#120B06 url("bg-mobile.png") center/cover no-repeat}
@media(min-width:760px){.bg{background-image:url("bg-desktop.png")}}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(to bottom,
  rgba(10,6,2,.74) 0%,rgba(10,6,2,.46) 24%,
  rgba(10,6,2,.14) 46%,rgba(10,6,2,.52) 74%,rgba(8,5,2,.88) 100%)}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
 align-items:center;padding:max(18px,env(safe-area-inset-top)) 22px max(16px,env(safe-area-inset-bottom))}
.rail{width:min(680px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px}
.rail .l,.rail .r{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--kn);font-weight:600;
 font-size:10px;color:var(--w72);letter-spacing:.06em}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--ember);
 box-shadow:0 0 10px var(--ember);animation:blip 2.4s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.2}}
.count{font-family:var(--kn);font-weight:700;font-size:12px;color:var(--gold)}
.count span{font-family:var(--nk);font-weight:400;font-size:9.5px;color:var(--w48);margin-left:3px}
.when{font-family:var(--kn);font-weight:500;font-size:10.5px;color:var(--w48);text-align:right}
.orbs{position:relative;width:60px;height:16px}
.orb{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
 transform:translate(-50%,-50%);transition:left 1s linear,opacity 1s}
.orb.sun{background:radial-gradient(circle at 36% 32%,#FFE9A8,#FF9B2E 62%,#E0451F);
 box-shadow:0 0 12px rgba(255,150,40,.95)}
.orb.moon{background:radial-gradient(circle at 36% 32%,#fff,#CBDAFF 62%,#93A9DC);
 box-shadow:0 0 11px rgba(175,200,255,.9)}
.hero{flex:1 1 auto;min-height:0;width:min(760px,100%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.badge{font-family:var(--kn);font-weight:600;font-size:11px;color:var(--gold);
 letter-spacing:.16em;margin-bottom:14px;opacity:.9}
.title{font-family:var(--kn);font-weight:700;
 font-size:clamp(30px,7.4vw,58px);line-height:1.14;letter-spacing:-.005em;
 text-shadow:0 2px 30px rgba(0,0,0,.75),0 1px 4px rgba(0,0,0,.6);
 max-width:14ch;margin:0 auto}
.artist{margin-top:14px;font-size:clamp(13px,3.4vw,17px);color:var(--w72);
 text-shadow:0 1px 16px rgba(0,0,0,.8)}
.film{margin-top:5px;font-size:clamp(11px,2.8vw,13px);color:var(--w48);
 text-shadow:0 1px 12px rgba(0,0,0,.8)}
.wave{width:min(560px,88%);display:flex;align-items:center;justify-content:center;
 gap:3px;height:34px;margin-top:26px}
.wave i{width:2px;border-radius:2px;height:10%;background:var(--w26);
 transition:background .5s,opacity .5s}
body.on-air .wave i{background:linear-gradient(to top,var(--ember),var(--gold));
 animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{from{height:10%}to{height:100%}}
.deck{flex:0 0 auto;width:min(560px,100%)}
.pg{padding:9px 0;cursor:pointer}
.trk{position:relative;height:3px;background:var(--w14);border-radius:3px}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;background:var(--w);
 transition:width .9s linear}
.knb{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:var(--w);
 transform:translate(-50%,-50%) scale(0);box-shadow:0 1px 8px rgba(0,0,0,.6);
 transition:left .9s linear,transform .2s}
.pg:hover .knb,body.on-air .knb{transform:translate(-50%,-50%) scale(1)}
.tm{display:flex;justify-content:space-between;margin-top:7px;
 font-family:var(--kn);font-weight:500;font-size:11px;color:var(--w48)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:0 4px}
.b{border:0;background:transparent;color:var(--w);cursor:pointer;display:grid;place-items:center;
 border-radius:50%;transition:transform .16s,color .16s,opacity .16s}
.b svg{fill:currentColor;display:block}
.b:hover{transform:translateY(-2px)}
.b:active{transform:scale(.9)}
.b-sm{width:42px;height:42px;color:var(--w48)}.b-sm svg{width:18px;height:18px}
.b-sm:hover{color:var(--w)}
.b-sm[aria-pressed=true]{color:var(--gold)}
.b-md{width:50px;height:50px}.b-md svg{width:28px;height:28px}
.b-lg{width:72px;height:72px;background:var(--w);color:#140C05;
 box-shadow:0 10px 34px rgba(0,0,0,.5)}
.b-lg:hover{transform:translateY(-2px) scale(1.05)}
.b-lg svg{width:30px;height:30px}
.b:focus-visible{outline:2.5px solid var(--gold);outline-offset:4px}
.tabs{flex:0 0 auto;display:flex;gap:20px;margin-top:20px;width:min(680px,100%);
 overflow-x:auto;scrollbar-width:none;justify-content:center}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;cursor:pointer;font-family:var(--kn);font-weight:600;font-size:14px;
 color:var(--w26);background:transparent;border:0;padding:3px 0 6px;white-space:nowrap;
 border-bottom:2px solid transparent;transition:color .18s,border-color .18s}
.tab:hover{color:var(--w72)}
.tab[aria-pressed=true]{color:var(--w);border-bottom-color:var(--gold)}
.tab[disabled]{opacity:.22;cursor:not-allowed}
.ft{flex:0 0 auto;margin-top:12px;text-align:center;font-size:9px;color:rgba(255,255,255,.24)}
.ft a{color:rgba(255,194,74,.42)}
.yt{position:fixed;bottom:-9999px;left:0;width:1px;height:1px;overflow:hidden}
@media(max-height:640px){.ft{display:none}.wave{height:24px;margin-top:16px}.title{font-size:28px}}
@media(prefers-reduced-motion:reduce){.wave i,.chip i{animation:none!important}}
</style>
</head>
<body>
<div class="bg"></div><div class="veil"></div>
<div class="yt"><div id="yt"></div></div>
<div class="stage">
 <div class="rail">
  <div class="l">
   <span class="chip"><i></i>ಆನ್ ಏರ್</span>
   <span class="count"><b id="lc">&mdash;</b><span>ಕೇಳುಗರು</span></span>
  </div>
  <div class="r">
   <div class="orbs"><div class="orb sun" id="sun"></div><div class="orb moon" id="moon"></div></div>
   <div class="when"><div id="clk">&mdash;</div><div id="dt" style="opacity:.7">&mdash;</div></div>
  </div>
 </div>
 <div class="hero">
  <div class="badge" id="bd">ದೋಸ್ತಾ ರೇಡಿಯೋ</div>
  <h1 class="title" id="t">ಪ್ಲೇ ಒತ್ತಿ</h1>
  <div class="artist" id="s">ಕನ್ನಡ ಹಾಡುಗಳು · ದಿನದ ೨೪ ಗಂಟೆ</div>
  <div class="film" id="f"></div>
  <div class="wave" id="wave" aria-hidden="true"></div>
 </div>
 <div class="deck">
  <div class="pg" id="pg"><div class="trk">
   <div class="fill" id="fill"></div><div class="knb" id="knb"></div></div></div>
  <div class="tm"><span id="t0">೦:೦೦</span><span id="t1">೦:೦೦</span></div>
  <div class="ctl">
   <button class="b b-sm" id="shuf" aria-pressed="true" aria-label="ಶಫಲ್">
    <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8.5h-2.2c-1 0-1.6.4-2.3 1.4l-1 1.5-1.2-1.8.8-1.2C12.1 6.7 13.3 6 15 6h2V3zM3 6h3.2c1.7 0 2.9.7 3.9 2.2l4 6c.7 1 1.3 1.4 2.3 1.4H21v2.9h-4.6c-1.7 0-2.9-.7-3.9-2.2l-4-6C7.8 9.3 7.2 8.9 6.2 8.9H3V6zm14 9.5V13l4 4-4 4v-2.5h-1v-3h1z"/></svg></button>
   <button class="b b-md" id="prev" aria-label="ಹಿಂದಿನ">
    <svg viewBox="0 0 24 24"><path d="M7 6h2.2v12H7zM20 6v12l-9-6z"/></svg></button>
   <button class="b b-lg" id="play" aria-label="ಪ್ಲೇ">
    <svg id="pi" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
   <button class="b b-md" id="next" aria-label="ಮುಂದಿನ">
    <svg viewBox="0 0 24 24"><path d="M14.8 6H17v12h-2.2zM4 6l9 6-9 6z"/></svg></button>
   <button class="b b-sm" id="rep" aria-pressed="false" aria-label="ರಿಪೀಟ್">
    <svg viewBox="0 0 24 24"><path d="M7 7h10v2.5l4-3.5-4-3.5V5H5v6h2V7zm10 10H7v-2.5l-4 3.5 4 3.5V19h12v-6h-2v4z"/></svg></button>
  </div>
 </div>
 <div class="tabs" id="tabs"></div>
 <div class="ft">YouTube ಮೂಲಕ ಪ್ಲೇ &middot; <a href="mailto:hello@dostaa.in">hello@dostaa.in</a> &middot; Dostaa</div>
</div>
<script>
var KD="೦೧೨೩೪೫೬೭೮೯";
function kn(x){return String(x).replace(/[0-9]/g,function(d){return KD[+d]})}
var MON=["ಜನವರಿ","ಫೆಬ್ರವರಿ","ಮಾರ್ಚ್","ಏಪ್ರಿಲ್","ಮೇ","ಜೂನ್","ಜುಲೈ","ಆಗಸ್ಟ್",
 "ಸೆಪ್ಟೆಂಬರ್","ಅಕ್ಟೋಬರ್","ನವೆಂಬರ್","ಡಿಸೆಂಬರ್"];
var DAY=["ಭಾನುವಾರ","ಸೋಮವಾರ","ಮಂಗಳವಾರ","ಬುಧವಾರ","ಗುರುವಾರ","ಶುಕ್ರವಾರ","ಶನಿವಾರ"];
var R=[{id:"all",label:"ಎಲ್ಲಾ"},{id:"classic",label:"ಹಳೆಯ ಚಿನ್ನ",tag:"classic"},
{id:"melody",label:"ಮಧುರ",tag:"melody"},{id:"dard",label:"ದುಃಖ",tag:"dard"},
{id:"mass",label:"ಮಾಸ್",tag:"mass"},{id:"folk",label:"ಜಾನಪದ",tag:"folk"}];
var $=function(q){return document.querySelector(q)};
var songs=[],q=[],i=0,pl=null,rdy=false,live=false,rot="all",tick=null,bad=0,repeatOne=false;
var PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M6.5 5h3.6v14H6.5zM13.9 5h3.6v14h-3.6z"/>';
(function(){var w=$("#wave"),s="";
for(var k=0;k<56;k++){var d=Math.abs(k-27.5)/27.5;
 s+='<i style="animation-delay:'+((k*0.045)%0.8).toFixed(2)+
 's;animation-duration:'+(0.6+(1-d)*0.5).toFixed(2)+'s"></i>'}
w.innerHTML=s})();
function ist(){var n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+19800000)}
function clockTick(){
 var d=ist(),h=d.getHours(),m=d.getMinutes(),sec=d.getSeconds();
 var day=(h*3600+m*60+sec)/3600;
 var sp=(day-6)/12, mp=day<18?(day+6)/12:(day-18)/12;
 function pos(el,p,vis){var c=Math.max(0,Math.min(1,p));
  el.style.left=(8+c*84)+"%";el.style.opacity=vis?1:.13}
 pos($("#sun"),sp,day>=6&&day<18);
 pos($("#moon"),mp,!(day>=6&&day<18));
 $("#clk").textContent=kn(h%12||12)+":"+kn(String(m).padStart(2,"0"))+" "+(h<12?"ಬೆ":"ಸಂ");
 $("#dt").textContent=DAY[d.getDay()]+" · "+kn(d.getDate())+" "+MON[d.getMonth()];
}
clockTick(); setInterval(clockTick,1000);
function lsn(){var n=new Date(),blk=Math.floor(n.getTime()/300000);
 var x=Math.sin(blk*12.9898)*43758.5453;x=x-Math.floor(x);
 var h=ist().getHours();
 var base=(h>=19&&h<=23)?520:((h>=7&&h<=10)?380:((h>=0&&h<=5)?110:300));
 var v=Math.floor(base+x*260); if(v>969)v=969; if(v<47)v=47;
 $("#lc").textContent=kn(v)}
lsn();setInterval(lsn,30000);
function tabs(){var el=$("#tabs");el.innerHTML="";
 R.forEach(function(r){
  var n=r.tag?songs.filter(function(s){return (s.tags||[]).indexOf(r.tag)>-1}).length:songs.length;
  var b=document.createElement("button");b.className="tab";b.type="button";b.textContent=r.label;
  b.setAttribute("aria-pressed",String(r.id===rot));
  if(n===0)b.disabled=true;
  b.onclick=function(){rot=r.id;tabs();build();if(live)go(0)};
  el.appendChild(b)})}
fetch("songs.json",{cache:"no-store"}).then(function(r){return r.json()})
 .then(function(d){songs=(Array.isArray(d)?d:[]).filter(function(s){return s&&s.id});tabs();build()})
 .catch(function(){tabs();build()});
function build(){var r=R.filter(function(x){return x.id===rot})[0];
 q=r&&r.tag?songs.filter(function(s){return (s.tags||[]).indexOf(r.tag)>-1}):songs.slice();
 for(var k=q.length-1;k>0;k--){var j=Math.random()*(k+1)|0;var t=q[k];q[k]=q[j];q[j]=t}
 var h=[];for(var z=0;z<q.length;z++){if(q[z].hot)h.push(z)}
 if(h.length){var p=h[Math.random()*h.length|0];var f=q[p];q.splice(p,1);q.unshift(f)}
 i=0}
window.onYouTubeIframeAPIReady=function(){
 pl=new YT.Player("yt",{height:"1",width:"1",
  playerVars:{playsinline:1,rel:0,controls:0,disablekb:1,modestbranding:1},
  events:{onReady:function(){rdy=true;if(live)go(i)},
  onStateChange:function(e){var on=e.data===YT.PlayerState.PLAYING;
   document.body.classList.toggle("on-air",on);
   $("#pi").innerHTML=on?PAUSE:PLAY;
   if(on){bad=0;start()}else{stop()}
   if(e.data===YT.PlayerState.ENDED){repeatOne?go(i):go(i+1)}},
  onError:function(){if(++bad<15){go(i+1)}else{bad=0;$("#t").textContent="ಹಾಡು ಸಿಗಲಿಲ್ಲ"}}}})};
(function(){var s=document.createElement("script");
 s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)})();
function go(k){if(!q.length)return;
 i=(k+q.length)%q.length;live=true;var s=q[i];
 var lab=R.filter(function(x){return x.id===rot})[0];
 $("#bd").textContent=lab?lab.label:"ದೋಸ್ತಾ ರೇಡಿಯೋ";
 $("#t").textContent=s.title||"";
 $("#s").textContent=s.singers||"";
 $("#f").textContent=[s.film,s.year?kn(s.year):""].filter(Boolean).join(" · ");
 $("#fill").style.width="0";$("#knb").style.left="0";
 $("#t0").textContent="೦:೦೦";$("#t1").textContent="೦:೦೦";
 if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata(
  {title:s.title||"",artist:s.singers||"Dostaa Radio",album:s.film||"",
   artwork:[{src:"https://i.ytimg.com/vi/"+s.id+"/hqdefault.jpg",sizes:"480x360",type:"image/jpeg"}]})}
 if(rdy&&pl)pl.loadVideoById(s.id)}
function fmt(x){x=Math.floor(x||0);
 return kn(Math.floor(x/60))+":"+kn(String(x%60).padStart(2,"0"))}
function start(){stop();tick=setInterval(function(){if(!pl||!rdy)return;
 var c=pl.getCurrentTime()||0,d=pl.getDuration()||0,p=d?c/d*100:0;
 $("#fill").style.width=p+"%";$("#knb").style.left=p+"%";
 $("#t0").textContent=fmt(c);$("#t1").textContent=fmt(d)},1000)}
function stop(){clearInterval(tick);tick=null}
$("#pg").onclick=function(e){if(!pl||!rdy||!live)return;
 var r=$("#pg").querySelector(".trk").getBoundingClientRect();
 pl.seekTo((e.clientX-r.left)/r.width*(pl.getDuration()||0),true)};
$("#play").onclick=function(){if(!q.length)return;
 if(!live){go(i);return}
 pl.getPlayerState()===YT.PlayerState.PLAYING?pl.pauseVideo():pl.playVideo()};
$("#next").onclick=function(){go(i+1)};
$("#prev").onclick=function(){
 if(pl&&rdy&&live&&(pl.getCurrentTime()||0)>3){pl.seekTo(0,true);return}go(i-1)};
$("#shuf").onclick=function(){var cur=q[i];build();
 if(cur){for(var z=0;z<q.length;z++){if(q[z].id===cur.id){i=z;break}}}};
$("#rep").onclick=function(e){repeatOne=!repeatOne;
 e.currentTarget.setAttribute("aria-pressed",String(repeatOne))};
addEventListener("keydown",function(e){if(e.target.matches("button"))return;
 if(e.code==="Space"){e.preventDefault();$("#play").click()}
 if(e.code==="ArrowRight")go(i+1);
 if(e.code==="ArrowLeft")$("#prev").click()});
</script>
</body>
</html>
