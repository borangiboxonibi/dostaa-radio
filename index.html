<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ದೋಸ್ತಾ ರೇಡಿಯೋ</title>
<meta name="theme-color" content="#0D0904"/>
<meta property="og:title" content="ದೋಸ್ತಾ ರೇಡಿಯೋ"/>
<meta property="og:description" content="ಕನ್ನಡ ಹಾಡುಗಳು, ದಿನದ 24 ಗಂಟೆ."/>
<meta property="og:image" content="https://radio.dostaa.in/bg-desktop.jpg"/>
<meta property="og:url" content="https://radio.dostaa.in"/>
<meta property="og:type" content="website"/>
<link rel="icon" href="bg-mobile.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
 --w:#FFFFFF;--w72:rgba(255,255,255,.72);--w48:rgba(255,255,255,.48);
 --w26:rgba(255,255,255,.26);--w14:rgba(255,255,255,.14);
 --gold:#FFC24A;--ember:#FF6A34;
 --kn:"Baloo Tamma 2",system-ui,sans-serif;
 --en:"Poppins",system-ui,sans-serif;
 --nk:"Noto Sans Kannada",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--nk);color:var(--w);overflow:hidden;background:#0D0904}
.bg{position:fixed;inset:0;z-index:0;background:#0D0904 url("bg-mobile.jpg") center/cover no-repeat}
@media(min-width:760px){.bg{background-image:url("bg-desktop.jpg")}}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(to bottom,rgba(10,6,2,.74) 0%,rgba(10,6,2,.46) 24%,
  rgba(10,6,2,.14) 46%,rgba(10,6,2,.55) 72%,rgba(8,5,2,.9) 100%)}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
 align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px);
 perspective:900px}
@media(max-width:380px){.rail{gap:6px}.orbs{width:38px}.find input{width:52px}.when{font-size:9px}}

.splash{position:fixed;inset:0;z-index:100;background:#0D0904;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:22px;padding:30px;transition:opacity .6s ease,visibility .6s}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash-mark{font-family:var(--kn);font-weight:800;font-size:clamp(22px,6vw,34px);
 color:var(--gold);letter-spacing:.01em;text-shadow:0 0 30px rgba(255,194,74,.3)}
.splash-line{font-family:var(--kn);font-weight:700;font-size:clamp(17px,4.6vw,26px);
 color:#FFFBF2;text-align:center;line-height:1.5;max-width:20ch}
.splash-line span{display:inline-block;opacity:0;transform:translateY(10px);
 animation:sp-up .6s ease forwards}
@keyframes sp-up{to{opacity:1;transform:translateY(0)}}
.splash-bar{width:180px;height:3px;border-radius:3px;background:var(--w14);overflow:hidden;position:relative}
.splash-bar i{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:3px;
 background:linear-gradient(90deg,var(--ember),var(--gold));
 animation:sp-load 1.6s ease-in-out infinite}
@keyframes sp-load{0%{left:-40%}100%{left:100%}}
.splash-disc{width:56px;height:56px;border-radius:50%;
 background:radial-gradient(circle at 38% 34%,#FFE9A8,#FF9B2E 55%,#C43A1C);
 box-shadow:0 0 40px rgba(255,150,60,.5);animation:sp-spin 2.4s linear infinite}
@keyframes sp-spin{to{transform:rotate(360deg)}}

.rail{width:min(720px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px}
.rail .l,.rail .r{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--en);font-weight:600;
 font-size:10px;color:var(--w72);letter-spacing:.06em}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--ember);
 box-shadow:0 0 10px var(--ember);animation:blip 2.4s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.2}}
.count{font-family:var(--en);font-weight:700;font-size:12px;color:var(--gold)}
.count span{font-family:var(--nk);font-weight:400;font-size:9.5px;color:var(--w48);margin-left:3px}
.when{font-family:var(--en);font-weight:500;font-size:10px;color:var(--w48);text-align:right;line-height:1.4}
.orbs{position:relative;width:52px;height:14px}
.orb{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;
 transform:translate(-50%,-50%);transition:left 1s linear,opacity 1s}
.orb.sun{background:radial-gradient(circle at 36% 32%,#FFE9A8,#FF9B2E 62%,#E0451F);
 box-shadow:0 0 11px rgba(255,150,40,.95)}
.orb.moon{background:radial-gradient(circle at 36% 32%,#fff,#CBDAFF 62%,#93A9DC);
 box-shadow:0 0 10px rgba(175,200,255,.9)}

.find{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.34);
 border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 6px 5px 12px;
 backdrop-filter:blur(10px);transition:border-color .2s,box-shadow .2s}
.find:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,194,74,.15)}
.find input{width:110px;border:0;outline:0;background:transparent;color:#fff;
 font-family:var(--en);font-weight:500;font-size:12.5px}
.find input::placeholder{color:rgba(255,255,255,.32)}
.find button{border:0;background:var(--gold);color:#140C05;cursor:pointer;
 width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
 font-weight:700;font-size:13px;flex:0 0 auto;transition:transform .15s}
.find button:active{transform:scale(.88)}
.find.miss{border-color:var(--ember);animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:480px){.find input{width:72px}}

.list-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--w14);
 background:rgba(0,0,0,.3);cursor:pointer;display:grid;place-items:center;
 color:var(--w72);flex:0 0 auto;transition:all .18s}
.list-btn:hover{border-color:rgba(255,194,74,.6);color:var(--w)}
.list-btn:active{transform:scale(.9)}
.list-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

.hero{flex:1 1 auto;min-height:0;width:min(760px,100%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.3,1)}
.badge{font-family:var(--en);font-weight:600;font-size:11px;color:var(--gold);
 letter-spacing:.14em;margin-bottom:14px;opacity:.92;min-height:1.2em;
 text-shadow:0 0 18px rgba(255,194,74,.35)}
.title-kn{font-family:var(--kn);font-weight:800;font-size:clamp(28px,7.2vw,54px);
 line-height:1.18;letter-spacing:0;color:#FFFBF2;
 text-shadow:0 3px 30px rgba(0,0,0,.8),0 1px 4px rgba(0,0,0,.65),0 0 40px rgba(255,194,74,.08);
 max-width:15ch;margin:0 auto;display:-webkit-box;-webkit-line-clamp:2;
 -webkit-box-orient:vertical;overflow:hidden}
.title-en{font-family:var(--en);font-weight:500;font-size:clamp(13px,3.2vw,17px);
 color:var(--w72);margin-top:7px;letter-spacing:.01em;text-shadow:0 1px 14px rgba(0,0,0,.8);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%}
.sno{display:inline-block;font-family:var(--en);font-weight:700;font-size:.4em;
 color:var(--gold);vertical-align:.5em;margin-right:.4em;opacity:.9}
.artist{margin-top:14px;font-family:var(--en);font-size:clamp(12px,3vw,14.5px);
 color:var(--w48);text-shadow:0 1px 12px rgba(0,0,0,.8)}
.dis-line{font-family:var(--nk);font-size:11px;color:var(--w48);margin-top:10px;
 max-width:36ch;line-height:1.5;opacity:.85;transition:opacity .3s,max-height .3s;overflow:hidden}
body.on-air .dis-line,body.live-started .dis-line{opacity:0;max-height:0;margin-top:0}
.hint-line{font-family:var(--en);font-size:10.5px;color:var(--ember);margin-top:8px;
 opacity:0;transition:opacity .3s;min-height:14px}
.hint-line.show{opacity:1}

.glow-sweep{position:absolute;left:50%;top:50%;width:280px;height:280px;
 transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,rgba(255,150,60,.18),transparent 68%);
 opacity:0;transition:opacity .8s ease}
body.on-air .glow-sweep{opacity:1;animation:pulse-glow 4.5s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}

.wave{position:relative;width:min(560px,86%);display:flex;align-items:center;justify-content:center;
 gap:3px;height:30px;margin-top:22px}
.wave i{width:2px;border-radius:2px;height:10%;background:var(--w26);transition:opacity .5s}
body.on-air .wave i{background:linear-gradient(to top,var(--ember),var(--gold));
 animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{from{height:10%}to{height:100%}}

.tools{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:20px}
.tbtn{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;position:relative;
 display:grid;place-items:center;color:var(--w);
 background:linear-gradient(155deg,#2A1E12,#130D07);
 box-shadow:0 8px 0 rgba(0,0,0,.35),0 12px 22px rgba(0,0,0,.5),
  inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,194,74,.1);
 transition:transform .1s,box-shadow .1s}
.tbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;position:relative;z-index:1}
.tbtn::before{content:"";position:absolute;inset:-8px;border-radius:50%;opacity:0;
 background:radial-gradient(circle,rgba(255,194,74,.35),transparent 70%);transition:opacity .2s}
.tbtn:hover::before{opacity:1}
.tbtn:hover{transform:translateY(-2px);
 box-shadow:0 10px 0 rgba(0,0,0,.35),0 16px 26px rgba(0,0,0,.5),
  inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(255,194,74,.25)}
.tbtn:active{transform:translateY(6px);
 box-shadow:0 2px 0 rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.4),
  inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(255,194,74,.15)}
.tbtn.on{color:#140C05;background:linear-gradient(155deg,var(--gold),var(--ember));
 box-shadow:0 8px 0 rgba(140,50,10,.5),0 12px 26px rgba(255,120,40,.4),
  inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(255,194,74,.5)}
.tbtn.on:active{box-shadow:0 2px 0 rgba(140,50,10,.5),0 4px 12px rgba(255,120,40,.35),
  inset 0 1px 0 rgba(255,255,255,.2)}
.tbtn-lbl{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);
 font-family:var(--en);font-size:9px;color:var(--w48);letter-spacing:.04em;white-space:nowrap}

.deck{flex:0 0 auto;width:min(560px,100%);margin-top:30px}
.pg{padding:8px 0;cursor:pointer}
.trk{position:relative;height:3px;background:var(--w14);border-radius:3px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;
 background:linear-gradient(90deg,var(--ember),var(--gold));transition:width .9s linear}
.fill::after{content:"";position:absolute;inset:0;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
 width:40px;transform:translateX(-40px);animation:sweep-line 2.6s ease-in-out infinite}
body:not(.on-air) .fill::after{animation-play-state:paused}
@keyframes sweep-line{0%{transform:translateX(-40px)}100%{transform:translateX(160px)}}
.knb{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;background:var(--w);
 transform:translate(-50%,-50%) scale(0);box-shadow:0 1px 8px rgba(0,0,0,.6),0 0 16px rgba(255,194,74,.5);
 transition:left .9s linear,transform .2s}
.pg:hover .knb,body.on-air .knb{transform:translate(-50%,-50%) scale(1)}
.tm{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--en);font-weight:500;
 font-size:10.5px;color:var(--w48)}

.deckplate{margin-top:16px;padding:16px 14px 12px;border-radius:20px;
 background:linear-gradient(155deg,#241A10,#0F0A05);
 box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06),
  inset 0 -2px 0 rgba(0,0,0,.4),0 0 0 1px rgba(255,194,74,.08)}
.ctl{display:flex;align-items:center;justify-content:center;gap:12px}
.tape{border:0;cursor:pointer;position:relative;color:var(--w72);
 background:linear-gradient(180deg,#3A2C1B,#1C1409);
 border-radius:11px;
 box-shadow:0 5px 0 #0A0602,0 9px 14px rgba(0,0,0,.5),
  inset 0 1px 0 rgba(255,255,255,.1),inset 0 -6px 10px rgba(0,0,0,.35);
 transition:transform .08s,box-shadow .08s;
 display:grid;place-items:center}
.tape svg{fill:currentColor;position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.tape:hover{color:var(--w)}
.tape:active{transform:translateY(5px);
 box-shadow:0 0 0 #0A0602,0 2px 6px rgba(0,0,0,.5),
  inset 0 1px 0 rgba(255,255,255,.06),inset 0 -3px 6px rgba(0,0,0,.4)}
.tape-sm{width:46px;height:40px}.tape-sm svg{width:17px;height:17px}
.tape-md{width:56px;height:48px}.tape-md svg{width:22px;height:22px}
.tape-lg{width:78px;height:58px;background:linear-gradient(180deg,#4A3016,#20140A);
 box-shadow:0 6px 0 #0A0602,0 11px 18px rgba(0,0,0,.55),
  inset 0 1px 0 rgba(255,255,255,.14),inset 0 -7px 12px rgba(0,0,0,.4),
  0 0 0 1px rgba(255,194,74,.15)}
.tape-lg svg{width:26px;height:26px;color:var(--gold)}
.tape-lg:active{transform:translateY(6px);
 box-shadow:0 0 0 #0A0602,0 3px 8px rgba(0,0,0,.55),
  inset 0 1px 0 rgba(255,255,255,.08),inset 0 -3px 7px rgba(0,0,0,.45)}
.tape[aria-pressed=true]{color:var(--gold);box-shadow:0 5px 0 #0A0602,0 9px 14px rgba(0,0,0,.5),
  inset 0 1px 0 rgba(255,255,255,.1),inset 0 -6px 10px rgba(0,0,0,.35),0 0 14px rgba(255,194,74,.4)}
.tape:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px}

.actors{flex:0 0 auto;display:flex;gap:8px;margin-top:16px;padding-top:12px;
 border-top:1px solid var(--w14);width:min(760px,100%);overflow-x:auto;scrollbar-width:none}
.actors::-webkit-scrollbar{display:none}
.ab{flex:0 0 auto;cursor:pointer;font-family:var(--en);font-weight:600;font-size:12.5px;
 color:var(--w48);background:rgba(255,255,255,.06);border:1px solid var(--w14);
 border-radius:999px;padding:6px 13px;white-space:nowrap;transition:all .18s}
.ab:hover{color:var(--w);border-color:rgba(255,194,74,.5);transform:translateY(-1px)}
.ab:active{transform:scale(.94)}
.ab[aria-pressed=true]{color:#140C05;background:var(--gold);border-color:var(--gold);
 box-shadow:0 0 16px rgba(255,194,74,.4)}

.ft{flex:0 0 auto;margin-top:10px;text-align:center;font-family:var(--en);font-size:9px;color:rgba(255,255,255,.24)}
.ft a{color:rgba(255,194,74,.42)}
.yt{position:fixed;bottom:-9999px;left:0;width:1px;height:1px;overflow:hidden}

.list-bg{position:fixed;inset:0;z-index:26;background:rgba(6,4,2,.8);backdrop-filter:blur(6px);
 display:none;align-items:flex-end;justify-content:center}
.list-bg.open{display:flex}
@media(min-width:640px){.list-bg{align-items:center}}
.list-sheet{width:100%;max-width:460px;max-height:78vh;background:#17110a;
 border:1px solid var(--w14);border-radius:20px 20px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.6);
 display:flex;flex-direction:column;overflow:hidden;animation:sheet-up .3s cubic-bezier(.2,.9,.3,1)}
@media(min-width:640px){.list-sheet{border-radius:20px}}
@keyframes sheet-up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
 border-bottom:1px solid var(--w14)}
.list-title{font-family:var(--en);font-weight:600;font-size:15px}
.list-close{width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.08);
 color:var(--w72);cursor:pointer;font-size:16px}
.list-search{padding:12px 18px 0}
.list-search input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--w14);
 border-radius:10px;padding:10px 12px;color:var(--w);font-family:var(--en);font-size:13px;outline:0}
.list-search input:focus{border-color:var(--gold)}
.list-body{padding:14px 18px 18px;overflow-y:auto;flex:1}
.srow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
 background:rgba(255,255,255,.04);cursor:pointer;transition:background .15s;margin-bottom:6px}
.srow:hover{background:rgba(255,255,255,.08)}
.srow .no{font-family:var(--en);font-weight:700;font-size:11px;color:var(--gold);flex:0 0 auto;width:34px}
.srow .tt{flex:1;min-width:0}
.srow .tt b{display:block;font-family:var(--nk);font-weight:600;font-size:13.5px;color:var(--w);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tt s{display:block;text-decoration:none;font-family:var(--en);font-size:10.5px;color:var(--w48)}
.empty{text-align:center;padding:30px 10px;font-family:var(--en);font-size:12.5px;color:var(--w48)}

.vid-bg{position:fixed;inset:0;z-index:22;background:rgba(4,3,1,.92);display:none;
 align-items:center;justify-content:center;padding:16px;flex-direction:column}
.vid-bg.open{display:flex}
.vid-box{width:min(720px,100%);position:relative}
.vid-frame-holder{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
 background:#000;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative}
.vid-close{position:absolute;top:-42px;right:0;width:34px;height:34px;border-radius:50%;
 border:1px solid var(--w14);background:rgba(0,0,0,.5);color:var(--w);cursor:pointer;
 font-size:18px;line-height:1;z-index:2}
.vid-cap{margin-top:12px;text-align:center;font-family:var(--nk);font-size:13px;color:var(--w72)}
.vid-ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:14px}
.vc{border:0;background:transparent;color:var(--w);cursor:pointer;display:grid;place-items:center;
 border-radius:50%;transition:transform .15s}
.vc:active{transform:scale(.88)}
.vc svg{fill:currentColor;width:20px;height:20px}
.vc-play{width:52px;height:52px;background:var(--w);color:#140C05}
.vc-play svg{width:22px;height:22px}

.vol-pop{position:fixed;z-index:30;width:64px;padding:16px 0 14px;border-radius:18px;
 background:rgba(15,10,5,.9);backdrop-filter:blur(14px);border:1px solid var(--w14);
 box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,194,74,.06);
 display:none;flex-direction:column;align-items:center;gap:10px;
 transform-origin:bottom center;opacity:0;transform:translateY(6px) scale(.92);
 transition:opacity .18s ease,transform .18s cubic-bezier(.2,.9,.3,1)}
.vol-pop.open{display:flex;opacity:1;transform:translateY(0) scale(1)}
.vol-pct{font-family:var(--en);font-weight:700;font-size:11px;color:var(--gold);
 text-shadow:0 0 10px rgba(255,194,74,.4)}
.vol-track-wrap{position:relative;width:34px;height:130px;display:flex;align-items:flex-end;
 justify-content:center;gap:4px}
.vol-eq{display:flex;align-items:flex-end;gap:3px;height:100%;padding-bottom:2px}
.vol-eq i{width:3px;border-radius:2px;background:var(--w14);transition:background .15s}
.vol-eq i.on{background:linear-gradient(to top,var(--ember),var(--gold));box-shadow:0 0 6px rgba(255,150,60,.5)}
.vol-slider{position:absolute;left:50%;top:50%;width:130px;height:34px;
 transform:translate(-50%,-50%) rotate(-90deg);-webkit-appearance:none;appearance:none;
 background:transparent;cursor:pointer;margin:0}
.vol-slider::-webkit-slider-runnable-track{height:4px;border-radius:4px;
 background:linear-gradient(to right,var(--gold) var(--fill,50%),var(--w14) var(--fill,50%))}
.vol-slider::-moz-range-track{height:4px;border-radius:4px;background:var(--w14)}
.vol-slider::-moz-range-progress{height:4px;border-radius:4px;background:linear-gradient(to right,var(--ember),var(--gold))}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
 background:var(--w);margin-top:-6px;cursor:grab;box-shadow:0 0 0 3px rgba(255,194,74,.28),0 2px 8px rgba(0,0,0,.5);
 transition:box-shadow .15s,transform .15s}
.vol-slider:hover::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(255,194,74,.4),0 2px 10px rgba(0,0,0,.5);transform:scale(1.12)}
.vol-slider:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.2)}
.vol-slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--w);border:0;cursor:grab;
 box-shadow:0 0 0 3px rgba(255,194,74,.28),0 2px 8px rgba(0,0,0,.5)}

@media(max-height:640px){.ft{display:none}.wave{height:20px;margin-top:16px}.title-kn{font-size:24px}
 .tools{margin-top:14px}.deckplate{padding:12px 10px 10px}}
@media(prefers-reduced-motion:reduce){.wave i,.chip i,.glow-sweep,.fill::after,.splash-disc{animation:none!important}
 .hero{transition:none!important}}
</style>
</head>
<body>
<div class="splash" id="splash">
 <div class="splash-disc"></div>
 <div class="splash-mark">ದೋಸ್ತಾ ರೇಡಿಯೋ</div>
 <div class="splash-line" id="splashLine"></div>
 <div class="splash-bar"><i></i></div>
</div>

<div class="bg"></div><div class="veil"></div>
<div class="yt" id="ytWrap"><div id="yt"></div></div>
<div class="vid-bg" id="vidBg">
 <div class="vid-box">
  <div class="vid-frame-holder" id="vidHolder">
   <button class="vid-close" id="vidClose">&times;</button>
  </div>
  <div class="vid-cap" id="vidCap"></div>
  <div class="vid-ctl">
   <button class="vc" id="vPrev" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M7 6h2.2v12H7zM20 6v12l-9-6z"/></svg></button>
   <button class="vc vc-play" id="vPlay" aria-label="play/pause"><svg id="vpi" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
   <button class="vc" id="vNext" aria-label="next"><svg viewBox="0 0 24 24"><path d="M14.8 6H17v12h-2.2zM4 6l9 6-9 6z"/></svg></button>
  </div>
 </div>
</div>

<div class="stage">
 <div class="rail">
  <div class="l">
   <span class="chip"><i></i>ON AIR</span>
   <span class="count"><b id="lc">&mdash;</b><span>listeners</span></span>
  </div>
  <div class="r">
   <label class="find" id="find">
    <input id="q" type="text" placeholder="# or movie" aria-label="Search"/>
    <button id="qgo" type="button" aria-label="Go">&rsaquo;</button>
   </label>
   <div class="orbs"><div class="orb sun" id="sun"></div><div class="orb moon" id="moon"></div></div>
   <div class="when"><div id="clk">&mdash;</div><div id="dt" style="opacity:.7">&mdash;</div></div>
   <button class="list-btn" id="listBtn" aria-label="Song list">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
   </button>
  </div>
 </div>

 <div class="hero" id="hero">
  <div class="glow-sweep"></div>
  <div class="badge" id="bd">Dostaa Radio</div>
  <h1 class="title-kn" id="tkn">Play to begin</h1>
  <div class="title-en" id="ten"></div>
  <div class="artist" id="s">Kannada songs &middot; 24&times;7</div>
  <div class="dis-line" id="disLine">ಎಲ್ಲಾ ಹಾಡುಗಳು YouTube ಮೂಲಕ ಪ್ಲೇ ಆಗುತ್ತವೆ. ಹಕ್ಕುಗಳು ಆಯಾ ಮಾಲೀಕರಿಗೆ ಸೇರಿವೆ.</div>
  <div class="hint-line" id="hintLine"></div>
  <div class="wave" id="wave" aria-hidden="true"></div>
  <div class="tools">
   <button class="tbtn" id="watchBtn" aria-label="Watch video">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h13a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M19 10l3-2v8l-3-2"/></svg>
    <span class="tbtn-lbl">Watch</span>
   </button>
   <button class="tbtn" id="volBtn" aria-label="Volume">
    <svg id="volIcon" viewBox="0 0 24 24"><path d="M4 9v6h3.5l4.5 4V5l-4.5 4H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>
    <span class="tbtn-lbl">Volume</span>
   </button>
  </div>
 </div>

 <div class="deck">
  <div class="pg" id="pg"><div class="trk"><div class="fill" id="fill"></div><div class="knb" id="knb"></div></div></div>
  <div class="tm"><span id="t0">0:00</span><span id="t1">0:00</span></div>
  <div class="deckplate">
   <div class="ctl">
    <button class="tape tape-sm" id="shuf" aria-pressed="true" aria-label="shuffle">
     <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8.5h-2.2c-1 0-1.6.4-2.3 1.4l-1 1.5-1.2-1.8.8-1.2C12.1 6.7 13.3 6 15 6h2V3zM3 6h3.2c1.7 0 2.9.7 3.9 2.2l4 6c.7 1 1.3 1.4 2.3 1.4H21v2.9h-4.6c-1.7 0-2.9-.7-3.9-2.2l-4-6C7.8 9.3 7.2 8.9 6.2 8.9H3V6zm14 9.5V13l4 4-4 4v-2.5h-1v-3h1z"/></svg></button>
    <button class="tape tape-md" id="prev" aria-label="previous">
     <svg viewBox="0 0 24 24"><path d="M7 6h2.2v12H7zM20 6v12l-9-6z"/></svg></button>
    <button class="tape tape-lg" id="play" aria-label="play">
     <svg id="pi" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="tape tape-md" id="next" aria-label="next">
     <svg viewBox="0 0 24 24"><path d="M14.8 6H17v12h-2.2zM4 6l9 6-9 6z"/></svg></button>
    <button class="tape tape-sm" id="rep" aria-pressed="false" aria-label="repeat">
     <svg viewBox="0 0 24 24"><path d="M7 7h10v2.5l4-3.5-4-3.5V5H5v6h2V7zm10 10H7v-2.5l-4 3.5 4 3.5V19h12v-6h-2v4z"/></svg></button>
   </div>
  </div>
 </div>

 <div class="actors" id="actors"></div>
 <div class="ft">Played via YouTube &middot; <a href="mailto:hello@dostaa.in">hello@dostaa.in</a> &middot; Dostaa</div>
</div>

<div class="vol-pop" id="volPop">
 <div class="vol-pct" id="volPct">80%</div>
 <div class="vol-track-wrap">
  <div class="vol-eq" id="volEq"><i></i><i></i><i></i><i></i><i></i></div>
  <input class="vol-slider" id="volSlider" type="range" min="0" max="100" value="80"/>
 </div>
</div>

<div class="list-bg" id="listBg">
 <div class="list-sheet">
  <div class="list-head">
   <span class="list-title">Songs</span>
   <button class="list-close" id="listClose">&times;</button>
  </div>
  <div class="list-search"><input id="listSearch" placeholder="Search by number or movie&hellip;"/></div>
  <div class="list-body" id="listBody"></div>
 </div>
</div>

<script>
var $=function(q){return document.querySelector(q)};
var songs=[],q=[],i=0,pl=null,rdy=false,live=false,tick=null,bad=0,repeatOne=false;
var actorFilter=null;
var PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M6.5 5h3.6v14H6.5zM13.9 5h3.6v14h-3.6z"/>';
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

(function(){
 var text="ಕನ್ನಡದ ದನಿಯಾಗಿ ಕನ್ನಡಿಗರಿಂದ ಕನ್ನಡಿಗರಿಗಾಗಿ";
 var words=text.split(" "), el=$("#splashLine"), html="";
 words.forEach(function(w,idx){
  html+='<span style="animation-delay:'+(idx*0.14).toFixed(2)+'s">'+w+'&nbsp;</span>';
 });
 el.innerHTML=html;
 setTimeout(function(){ $("#splash").classList.add("gone") }, 2400);
})();

(function(){var w=$("#wave"),s="";
for(var k=0;k<56;k++){var d=Math.abs(k-27.5)/27.5;
 s+='<i style="animation-delay:'+((k*0.045)%0.8).toFixed(2)+
 's;animation-duration:'+(0.6+(1-d)*0.5).toFixed(2)+'s"></i>'}
w.innerHTML=s})();

(function(){
 var hero=$("#hero"),active=false;
 function apply(x,y,rect){
  var px=(x-rect.left)/rect.width-0.5, py=(y-rect.top)/rect.height-0.5;
  hero.style.transform="rotateY("+(px*6).toFixed(2)+"deg) rotateX("+(-py*6).toFixed(2)+"deg)";
 }
 function reset(){hero.style.transform="rotateY(0deg) rotateX(0deg)"}
 hero.addEventListener("pointermove",function(e){
  if(e.pointerType==="mouse"){apply(e.clientX,e.clientY,hero.getBoundingClientRect())}
 });
 hero.addEventListener("pointerleave",reset);
 hero.addEventListener("touchstart",function(){active=true},{passive:true});
 hero.addEventListener("touchmove",function(e){
  if(!active||!e.touches[0])return;
  apply(e.touches[0].clientX,e.touches[0].clientY,hero.getBoundingClientRect());
 },{passive:true});
 hero.addEventListener("touchend",function(){active=false;reset()});
})();

function ist(){var n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+19800000)}
function clockTick(){
 var d=ist(),h=d.getHours(),m=d.getMinutes(),sec=d.getSeconds();
 var day=(h*3600+m*60+sec)/3600;
 var sp=(day-6)/12, mp=day<18?(day+6)/12:(day-18)/12;
 function pos(el,p,vis){var c=Math.max(0,Math.min(1,p));el.style.left=(8+c*84)+"%";el.style.opacity=vis?1:.13}
 pos($("#sun"),sp,day>=6&&day<18);
 pos($("#moon"),mp,!(day>=6&&day<18));
 var hh=h%12||12,ap=h<12?"AM":"PM";
 $("#clk").textContent=hh+":"+String(m).padStart(2,"0")+" "+ap;
 $("#dt").textContent=DAY[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];
}
clockTick(); setInterval(clockTick,1000);

function lsn(){var n=new Date(),blk=Math.floor(n.getTime()/300000);
 var x=Math.sin(blk*12.9898)*43758.5453;x=x-Math.floor(x);
 var h=ist().getHours();
 var base=(h>=19&&h<=23)?520:((h>=7&&h<=10)?380:((h>=0&&h<=5)?110:300));
 var v=Math.floor(base+x*260); if(v>969)v=969; if(v<47)v=47;
 $("#lc").textContent=v.toLocaleString("en-IN")}
lsn();setInterval(lsn,30000);

function actorRail(){
 var counts={};
 songs.forEach(function(s){if(s.actor)counts[s.actor]=(counts[s.actor]||0)+1});
 var names=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]});
 var el=$("#actors");el.innerHTML="";
 if(!names.length)return;
 var allBtn=document.createElement("button");
 allBtn.className="ab";allBtn.type="button";allBtn.textContent="All";
 allBtn.setAttribute("aria-pressed",String(!actorFilter));
 allBtn.onclick=function(){actorFilter=null;actorRail();build();if(live)go(0)};
 el.appendChild(allBtn);
 names.forEach(function(name){
  var b=document.createElement("button");
  b.className="ab";b.type="button";b.textContent=name+" ("+counts[name]+")";
  b.setAttribute("aria-pressed",String(actorFilter===name));
  b.onclick=function(){actorFilter=name;actorRail();build();if(live)go(0)};
  el.appendChild(b);
 });
}

fetch("songs.json",{cache:"no-store"}).then(function(r){return r.json()})
 .then(function(d){songs=(Array.isArray(d)?d:[]).filter(function(s){return s&&s.id});actorRail();build()})
 .catch(function(){build()});

function build(){
 q=actorFilter?songs.filter(function(s){return s.actor===actorFilter}):songs.slice();
 for(var k=q.length-1;k>0;k--){var j=Math.random()*(k+1)|0;var t=q[k];q[k]=q[j];q[j]=t}
 var h=[];for(var z=0;z<q.length;z++){if(q[z].hot)h.push(z)}
 if(h.length){var p=h[Math.random()*h.length|0];var f=q[p];q.splice(p,1);q.unshift(f)}
 i=0}

window.onYouTubeIframeAPIReady=function(){
 pl=new YT.Player("yt",{height:"1",width:"1",
  playerVars:{playsinline:1,rel:0,controls:0,disablekb:1,modestbranding:1},
  events:{onReady:function(){rdy=true;if(live)go(i);
   try{pl.setVolume(volLevel)}catch(e){}
   if(pendingVideo){pendingVideo=false;enterVideo()}},
  onStateChange:function(e){var on=e.data===YT.PlayerState.PLAYING;
   document.body.classList.toggle("on-air",on);
   $("#pi").innerHTML=on?PAUSE:PLAY;
   var vpi=$("#vpi"); if(vpi)vpi.innerHTML=on?PAUSE:PLAY;
   if(on){bad=0;start()}else{stop()}
   if(e.data===YT.PlayerState.ENDED){repeatOne?go(i):go(i+1)}},
  onError:function(){if(++bad<15){go(i+1)}else{bad=0;$("#tkn").textContent="Song unavailable"}}}})};
(function(){var s=document.createElement("script");
 s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)})();

function go(k){if(!q.length)return;
 i=(k+q.length)%q.length;live=true;var s=q[i];
 $("#bd").textContent=s.actor||"Dostaa Radio";
 var numTag=s.no?'<span class="sno">#'+s.no+'</span>':"";
 var esc=function(t){return String(t||"").replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};
 if(s.kn){
  $("#tkn").innerHTML=numTag+esc(s.kn);
  $("#ten").textContent=s.title||"";
  $("#ten").style.display="block";
 } else {
  $("#tkn").innerHTML=numTag+esc(s.title);
  $("#ten").textContent="";
  $("#ten").style.display="none";
 }
 $("#s").textContent=[s.singers,s.film].filter(Boolean).join(" \u00b7 ");
 document.body.classList.add("live-started");
 $("#fill").style.width="0";$("#knb").style.left="0";
 $("#t0").textContent="0:00";$("#t1").textContent="0:00";
 if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata(
  {title:s.kn||s.title||"",artist:s.singers||"Dostaa Radio",album:s.film||"",
   artwork:[{src:"https://i.ytimg.com/vi/"+s.id+"/hqdefault.jpg",sizes:"480x360",type:"image/jpeg"}]})}
 if(rdy&&pl)pl.loadVideoById(s.id)}

function fmt(x){x=Math.floor(x||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
function start(){stop();tick=setInterval(function(){if(!pl||!rdy)return;
 var c=pl.getCurrentTime()||0,d=pl.getDuration()||0,p=d?c/d*100:0;
 $("#fill").style.width=p+"%";$("#knb").style.left=p+"%";
 $("#t0").textContent=fmt(c);$("#t1").textContent=fmt(d)},1000)}
function stop(){clearInterval(tick);tick=null}

$("#pg").onclick=function(e){if(!pl||!rdy||!live)return;
 var r=$("#pg").querySelector(".trk").getBoundingClientRect();
 pl.seekTo((e.clientX-r.left)/r.width*(pl.getDuration()||0),true)};
$("#play").onclick=function(){if(!q.length)return;
 if(!live){go(i);return}
 pl.getPlayerState()===YT.PlayerState.PLAYING?pl.pauseVideo():pl.playVideo()};
$("#next").onclick=function(){go(i+1)};
$("#prev").onclick=function(){
 if(pl&&rdy&&live&&(pl.getCurrentTime()||0)>3){pl.seekTo(0,true);return}go(i-1)};
$("#shuf").onclick=function(){var cur=q[i];build();
 if(cur){for(var z=0;z<q.length;z++){if(q[z].id===cur.id){i=z;break}}}};
$("#rep").onclick=function(e){repeatOne=!repeatOne;
 e.currentTarget.setAttribute("aria-pressed",String(repeatOne))};

function jumpTo(hit){
 if(!hit)return false;
 var at=-1;for(var y=0;y<q.length;y++){if(q[y].id===hit.id){at=y;break}}
 if(at<0){q.unshift(hit);at=0}
 go(at); return true;
}
function jump(){
 var raw=$("#q").value.trim();
 if(!raw)return;
 var hit=null, pool=actorFilter?songs.filter(function(s){return s.actor===actorFilter}):songs;
 if(/^\d+$/.test(raw)){
  var v=parseInt(raw,10);
  for(var z=0;z<songs.length;z++){if(songs[z].no===v){hit=songs[z];break}}
 } else {
  var needle=raw.toLowerCase();
  var matches=pool.filter(function(s){return (s.film||"").toLowerCase().indexOf(needle)>-1
   || (s.title||"").toLowerCase().indexOf(needle)>-1});
  hit=matches[0]||null;
 }
 if(!jumpTo(hit)){
  var f=$("#find");f.classList.remove("miss");
  void f.offsetWidth;f.classList.add("miss");
  setTimeout(function(){f.classList.remove("miss")},600);return
 }
 $("#q").value="";$("#q").blur();
}
$("#qgo").onclick=jump;
$("#q").addEventListener("keydown",function(e){
 if(e.key==="Enter"){e.preventDefault();jump()}
 e.stopPropagation();
});

addEventListener("keydown",function(e){if(e.target.matches("button,input"))return;
 if(e.code==="Space"){e.preventDefault();$("#play").click()}
 if(e.code==="ArrowRight")go(i+1);
 if(e.code==="ArrowLeft")$("#prev").click()});

function esc(t){return String(t||"").replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function renderList(filter){
 var body=$("#listBody");
 var needle=(filter||"").trim().toLowerCase();
 var list = needle ? songs.filter(function(s){
   return (s.film||"").toLowerCase().indexOf(needle)>-1
     || (s.title||"").toLowerCase().indexOf(needle)>-1
     || String(s.no)===needle;
 }) : songs;
 if(!list.length){ body.innerHTML='<div class="empty">No songs match.</div>'; return }
 var frag = list.slice(0,200).map(function(s){
  return '<div class="srow" data-id="'+s.id+'"><span class="no">#'+s.no+'</span>'+
   '<div class="tt"><b>'+esc(s.kn||s.title)+'</b><s>'+esc(s.film||"")+'</s></div></div>';
 }).join("");
 body.innerHTML=frag;
 body.querySelectorAll(".srow").forEach(function(row){
  row.addEventListener("click",function(){
   var s=songs.find(function(x){return x.id===row.dataset.id});
   jumpTo(s); closeList();
  });
 });
}
function openList(){ $("#listBg").classList.add("open"); renderList($("#listSearch").value) }
function closeList(){ $("#listBg").classList.remove("open") }
$("#listBtn").onclick=openList;
$("#listClose").onclick=closeList;
$("#listBg").onclick=function(e){ if(e.target===$("#listBg"))closeList() };
$("#listSearch").addEventListener("input",function(){ renderList(this.value) });

var videoMode = false, pendingVideo = false;
function hint(msg){
 var h=$("#hintLine"); h.textContent=msg; h.classList.add("show");
 clearTimeout(hint._t); hint._t=setTimeout(function(){h.classList.remove("show")},2600);
}
function syncVideoRect(){
 if(!videoMode)return;
 var r = $("#vidHolder").getBoundingClientRect();
 $("#ytWrap").style.cssText =
  "position:fixed;left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;height:"+r.height+"px;"+
  "opacity:1;pointer-events:auto;z-index:23;overflow:hidden;border-radius:14px";
 pl.setSize(Math.round(r.width), Math.round(r.height));
}
function enterVideo(){
 if(!q.length){ hint("No songs loaded yet"); return }
 if(!live){ go(i); }
 if(!pl||!rdy){ pendingVideo=true; hint("Loading player\u2026"); return }
 videoMode = true;
 var s=q[i]; if(s){ $("#vidCap").textContent = (s.kn||s.title) + (s.singers?" \u00b7 "+s.singers:"") }
 $("#vidBg").classList.add("open");
 requestAnimationFrame(syncVideoRect);
}
function exitVideo(){
 videoMode = false;
 $("#vidBg").classList.remove("open");
 $("#ytWrap").style.cssText = "position:fixed;bottom:-9999px;left:0;width:1px;height:1px;overflow:hidden";
 pl.setSize(1,1);
}
$("#watchBtn").onclick=function(){ videoMode?exitVideo():enterVideo() };
$("#vidClose").onclick=exitVideo;
$("#vidBg").onclick=function(e){ if(e.target===$("#vidBg"))exitVideo() };
$("#vPlay").onclick=function(){ $("#play").click() };
$("#vPrev").onclick=function(){ $("#prev").click() };
$("#vNext").onclick=function(){ $("#next").click() };
addEventListener("resize",syncVideoRect);
addEventListener("orientationchange",function(){ setTimeout(syncVideoRect,200) });

var volLevel = 80, volOpen = false;
try{ var sv=localStorage.getItem("dostaa_volume"); if(sv!==null) volLevel=Math.max(0,Math.min(100,parseInt(sv,10))) }catch(e){}
var ICON_HIGH = '<path d="M4 9v6h3.5l4.5 4V5l-4.5 4H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8 8 0 0 1 0 12"/>';
var ICON_LOW  = '<path d="M4 9v6h3.5l4.5 4V5l-4.5 4H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>';
var ICON_MUTE = '<path d="M4 9v6h3.5l4.5 4V5l-4.5 4H4z"/><path d="M16 9l5 6M21 9l-5 6"/>';
function renderVolUI(){
 $("#volSlider").value = volLevel;
 $("#volSlider").style.setProperty("--fill", volLevel + "%");
 $("#volPct").textContent = volLevel + "%";
 $("#volIcon").innerHTML = volLevel===0 ? ICON_MUTE : (volLevel<50 ? ICON_LOW : ICON_HIGH);
 var bars=$("#volEq").children, n=bars.length;
 for(var k=0;k<n;k++){
  var thresh=((k+1)/n)*100;
  bars[k].classList.toggle("on", volLevel>0 && volLevel>=thresh-100/n/2);
  bars[k].style.height = (18 + k*7) + "px";
 }
}
function setVolume(v){
 volLevel = Math.max(0,Math.min(100,Math.round(v)));
 try{localStorage.setItem("dostaa_volume",volLevel)}catch(e){}
 if(pl && pl.setVolume) try{pl.setVolume(volLevel)}catch(e){}
 renderVolUI();
}
renderVolUI();
function positionVolPop(){
 var r=$("#volBtn").getBoundingClientRect(), pop=$("#volPop");
 pop.style.left = Math.min(Math.max(8,r.left+r.width/2-32), innerWidth-72) + "px";
 pop.style.top = "auto";
 pop.style.bottom = (innerHeight - r.top + 10) + "px";
}
function openVolPop(){ volOpen=true; positionVolPop(); $("#volPop").classList.add("open"); $("#volBtn").classList.add("on") }
function closeVolPop(){ volOpen=false; $("#volPop").classList.remove("open"); $("#volBtn").classList.remove("on") }
$("#volBtn").onclick=function(e){ e.stopPropagation(); volOpen?closeVolPop():openVolPop() };
$("#volSlider").addEventListener("input",function(){ setVolume(+this.value) });
document.addEventListener("click",function(e){
 if(volOpen && !e.target.closest("#volPop") && !e.target.closest("#volBtn")) closeVolPop();
});
addEventListener("keydown",function(e){ if(e.key==="Escape"&&volOpen) closeVolPop() });
addEventListener("resize",function(){ if(volOpen) positionVolPop() });
</script>
</body>
</html>
