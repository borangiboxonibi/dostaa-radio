<style>
:root{
 --w:#FFFFFF;--w72:rgba(255,255,255,.72);--w48:rgba(255,255,255,.48);
 --w26:rgba(255,255,255,.26);--w14:rgba(255,255,255,.14);
 --gold:#FFC24A;--ember:#FF6A34;
 --kn:"Baloo Tamma 2",system-ui,sans-serif;
 --nk:"Noto Sans Kannada",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--nk);color:var(--w);overflow:hidden;background:#120B06}
.bg{position:fixed;inset:0;z-index:0;
 background:#120B06 url("bg-mobile.jpg") center/cover no-repeat}
@media(min-width:760px){.bg{background-image:url("bg-desktop.jpg")}}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(to bottom,
  rgba(10,6,2,.74) 0%,rgba(10,6,2,.46) 24%,
  rgba(10,6,2,.14) 46%,rgba(10,6,2,.52) 74%,rgba(8,5,2,.88) 100%)}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
 align-items:center;padding:max(18px,env(safe-area-inset-top)) 22px max(16px,env(safe-area-inset-bottom))}
.rail{width:min(680px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px}
.rail .l,.rail .r{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--kn);font-weight:600;
 font-size:10px;color:var(--w72);letter-spacing:.06em}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--ember);
 box-shadow:0 0 10px var(--ember);animation:blip 2.4s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.2}}
.count{font-family:var(--kn);font-weight:700;font-size:12px;color:var(--gold)}
.count span{font-family:var(--nk);font-weight:400;font-size:9.5px;color:var(--w48);margin-left:3px}
.when{font-family:var(--kn);font-weight:500;font-size:10.5px;color:var(--w48);text-align:right}
.find{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.34);
 border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 7px 5px 11px;
 backdrop-filter:blur(10px);transition:border-color .2s,background .2s}
.find:focus-within{border-color:var(--gold);background:rgba(0,0,0,.5)}
.find span{font-family:var(--kn);font-weight:700;font-size:13px;color:var(--gold);line-height:1}
.find input{width:52px;border:0;outline:0;background:transparent;color:#fff;
 font-family:var(--kn);font-weight:600;font-size:14px;letter-spacing:.04em}
.find input::placeholder{color:rgba(255,255,255,.3);font-weight:500}
.find input::-webkit-outer-spin-button,.find input::-webkit-inner-spin-button{
 -webkit-appearance:none;margin:0}
.find button{border:0;background:var(--gold);color:#140C05;cursor:pointer;
 width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
 font-family:var(--kn);font-weight:700;font-size:14px;line-height:1;
 transition:transform .15s}
.find button:hover{transform:scale(1.1)}
.find.miss{border-color:var(--ember);animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}
 75%{transform:translateX(4px)}}
.sno{display:inline-block;font-family:var(--kn);font-weight:700;
 font-size:.44em;color:var(--gold);vertical-align:.42em;margin-right:.36em;
 opacity:.85;letter-spacing:.02em}
.arcwrap{position:fixed;left:0;right:0;top:0;height:46vh;z-index:1;pointer-events:none}
.arcwrap svg{width:100%;height:100%;display:block;overflow:visible}
.arcpath{fill:none;stroke:rgba(255,255,255,.09);stroke-width:1;stroke-dasharray:2 7}
#sunG,#moonG{transition:opacity 2.4s ease}
.rays{transform-origin:center;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.corona{animation:pulse 5.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.32;r:26}50%{opacity:.16;r:34}}
.sky-tint{position:fixed;inset:0;z-index:1;pointer-events:none;
 transition:background 4s ease;mix-blend-mode:screen}
.hero{flex:1 1 auto;min-height:0;width:min(760px,100%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.badge{font-family:var(--kn);font-weight:600;font-size:11px;color:var(--gold);
 letter-spacing:.16em;margin-bottom:14px;opacity:.9}
.title{font-family:var(--kn);font-weight:700;
 font-size:clamp(26px,6.6vw,52px);line-height:1.16;letter-spacing:-.005em;
 text-shadow:0 2px 30px rgba(0,0,0,.75),0 1px 4px rgba(0,0,0,.6);
 max-width:15ch;margin:0 auto;display:-webkit-box;-webkit-line-clamp:2;
 -webkit-box-orient:vertical;overflow:hidden}
.artist{margin-top:14px;font-size:clamp(13px,3.4vw,17px);color:var(--w72);
 text-shadow:0 1px 16px rgba(0,0,0,.8)}
.film{margin-top:5px;font-size:clamp(11px,2.8vw,13px);color:var(--w48);
 text-shadow:0 1px 12px rgba(0,0,0,.8)}
.wave{position:relative;width:min(600px,92%);height:72px;margin-top:24px;
 display:flex;align-items:center;justify-content:center;gap:3px}
.wave::before{content:"";position:absolute;left:8%;right:8%;top:26%;bottom:26%;
 background:radial-gradient(60% 100% at 50% 50%,rgba(255,140,60,.30),transparent 72%);
 filter:blur(22px);opacity:0;transition:opacity 1.1s ease;pointer-events:none}
body.on-air .wave::before{opacity:1}
.wave i{width:3px;height:8px;border-radius:99px;flex:0 0 auto;
 transform:scaleY(1);will-change:transform;
 transition:opacity .9s ease,background .9s ease}
.wave i{opacity:.30;background:rgba(255,255,255,.4)}
body.on-air .wave i{opacity:1}
@media(max-width:420px){.wave{height:56px;gap:2px}.wave i{width:2px}}
.deck{flex:0 0 auto;width:min(560px,100%)}
.pg{padding:9px 0;cursor:pointer}
.trk{position:relative;height:3px;background:var(--w14);border-radius:3px}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;background:var(--w);
 transition:width .9s linear}
.knb{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:var(--w);
 transform:translate(-50%,-50%) scale(0);box-shadow:0 1px 8px rgba(0,0,0,.6);
 transition:left .9s linear,transform .2s}
.pg:hover .knb,body.on-air .knb{transform:translate(-50%,-50%) scale(1)}
.tm{display:flex;justify-content:space-between;margin-top:7px;
 font-family:var(--kn);font-weight:500;font-size:11px;color:var(--w48)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:0 4px}
.b{border:0;background:transparent;color:var(--w);cursor:pointer;display:grid;place-items:center;
 border-radius:50%;transition:transform .16s,color .16s,opacity .16s}
.b svg{fill:currentColor;display:block}
.b:hover{transform:translateY(-2px)}
.b:active{transform:scale(.9)}
.b-sm{width:42px;height:42px;color:var(--w48)}.b-sm svg{width:18px;height:18px}
.b-sm:hover{color:var(--w)}
.b-sm[aria-pressed=true]{color:var(--gold)}
.b-md{width:50px;height:50px}.b-md svg{width:28px;height:28px}
.b-lg{width:72px;height:72px;background:var(--w);color:#140C05;
 box-shadow:0 10px 34px rgba(0,0,0,.5)}
.b-lg:hover{transform:translateY(-2px) scale(1.05)}
.b-lg svg{width:30px;height:30px}
.b:focus-visible{outline:2.5px solid var(--gold);outline-offset:4px}
.tabs{flex:0 0 auto;display:flex;gap:20px;margin-top:20px;width:min(680px,100%);
 overflow-x:auto;scrollbar-width:none;justify-content:center}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;cursor:pointer;font-family:var(--kn);font-weight:600;font-size:14px;
 color:var(--w26);background:transparent;border:0;padding:3px 0 6px;white-space:nowrap;
 border-bottom:2px solid transparent;transition:color .18s,border-color .18s}
.tab:hover{color:var(--w72)}
.tab[aria-pressed=true]{color:var(--w);border-bottom-color:var(--gold)}
.tab[disabled]{opacity:.22;cursor:not-allowed}
.ft{flex:0 0 auto;margin-top:12px;text-align:center;font-size:9px;color:rgba(255,255,255,.24)}
.ft a{color:rgba(255,194,74,.42)}
.yt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220px;height:124px;opacity:.001;pointer-events:none;z-index:0}.warn{position:fixed;left:12px;right:12px;bottom:12px;z-index:9;display:none;background:#1B1108;border:1px solid rgba(255,194,74,.5);border-radius:14px;padding:11px 14px;font-size:12px;color:#FFF3DE;text-align:center;line-height:1.5}.warn b{color:#FFC24A}
@media(max-height:640px){.ft{display:none}.wave{height:24px;margin-top:16px}.title{font-size:28px}}
@media(prefers-reduced-motion:reduce){.wave i,.chip i{animation:none!important}}
</style>
</head>

<script>
var KD="೦೧೨೩೪೫೬೭೮೯";
function kn(x){return String(x).replace(/[0-9]/g,function(d){return KD[+d]})}
var MON=["ಜನವರಿ","ಫೆಬ್ರವರಿ","ಮಾರ್ಚ್","ಏಪ್ರಿಲ್","ಮೇ","ಜೂನ್","ಜುಲೈ","ಆಗಸ್ಟ್",
 "ಸೆಪ್ಟೆಂಬರ್","ಅಕ್ಟೋಬರ್","ನವೆಂಬರ್","ಡಿಸೆಂಬರ್"];
var DAY=["ಭಾನುವಾರ","ಸೋಮವಾರ","ಮಂಗಳವಾರ","ಬುಧವಾರ","ಗುರುವಾರ","ಶುಕ್ರವಾರ","ಶನಿವಾರ"];
var R=[{id:"all",label:"ಎಲ್ಲಾ"},{id:"classic",label:"ಹಳೆಯ ಚಿನ್ನ",tag:"classic"},
{id:"melody",label:"ಮಧುರ",tag:"melody"},{id:"dard",label:"ದುಃಖ",tag:"dard"},
{id:"mass",label:"ಮಾಸ್",tag:"mass"},{id:"folk",label:"ಜಾನಪದ",tag:"folk"}];
var $=function(q){return document.querySelector(q)};
var IGW=/Instagram|FBAN|FBAV|Line\/|Twitter/i.test(navigator.userAgent);
var songs=[],q=[],i=0,pl=null,rdy=false,live=false,rot="all",tick=null,bad=0,repeatOne=false;
var PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M6.5 5h3.6v14H6.5zM13.9 5h3.6v14h-3.6z"/>';
var BARS=[],NB=0;
(function(){
 var w=$("#wave");
 NB = innerWidth<420 ? 40 : (innerWidth<760 ? 52 : 68);
 var frag=document.createDocumentFragment();
 for(var k=0;k<NB;k++){
  var b=document.createElement("i");
  var d=Math.abs(k-(NB-1)/2)/((NB-1)/2);
  /* ember at the edges, gold through the middle */
  var r=255, g=Math.round(106+88*(1-d)), bl=Math.round(52+22*(1-d));
  b.style.background="rgb("+r+","+g+","+bl+")";
  b.dataset.d=d.toFixed(3);
  frag.appendChild(b); BARS.push(b);
 }
 w.innerHTML=""; w.appendChild(frag);
})();

/* one travelling wave, three harmonics — neighbours stay related */
var wavePhase=0, waveAmp=0;
(function tick(){
 var on=document.body.classList.contains("on-air");
 waveAmp += ((on?1:0)-waveAmp)*0.05;          /* ease in and out */
 wavePhase += on?0.055:0.012;
 for(var k=0;k<NB;k++){
  var d=+BARS[k].dataset.d;
  var env=Math.pow(1-d,1.35);                  /* tall in the middle */
  var v = Math.sin(wavePhase + k*0.36)*0.55
        + Math.sin(wavePhase*1.73 + k*0.14)*0.30
        + Math.sin(wavePhase*0.61 + k*0.72)*0.15;
  var h = 1 + (0.6 + env*7.4) * ((v+1)/2) * waveAmp;
  BARS[k].style.transform="scaleY("+h.toFixed(3)+")";
 }
 requestAnimationFrame(tick);
})();
function ist(){var n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+19800000)}
function clockTick(){
 var d=ist(),h=d.getHours(),m=d.getMinutes(),sec=d.getSeconds();
 var day=(h*3600+m*60+sec)/3600;
 var sp=(day-6)/12, mp=day<18?(day+6)/12:(day-18)/12;
 function arc(p){var t=Math.max(-.06,Math.min(1.06,p)),a=Math.PI*(1-t);
  return [500+540*Math.cos(a),430-540*Math.sin(a)*0.74]}
 var isDay=day>=6&&day<18;
 var sxy=arc(sp),mxy=arc(mp);
 var sg=$("#sunG"),mg=$("#moonG");
 sg.setAttribute("transform","translate("+sxy[0].toFixed(1)+","+sxy[1].toFixed(1)+")");
 mg.setAttribute("transform","translate("+mxy[0].toFixed(1)+","+mxy[1].toFixed(1)+")");
 sg.style.opacity=isDay?1:0; mg.style.opacity=isDay?0:1;
 var tint = day<5.5 ? "rgba(30,44,110,.30)"
   : day<7.5  ? "rgba(255,138,60,.20)"
   : day<16   ? "rgba(120,170,255,.09)"
   : day<19   ? "rgba(255,110,40,.22)"
   : "rgba(24,36,96,.32)";
 $("#tint").style.background="linear-gradient(to bottom,"+tint+",transparent 62%)";
 $("#clk").textContent=(h%12||12)+":"+String(m).padStart(2,"0")+" "+(h<12?"AM":"PM");
 $("#dt").textContent=DAY[d.getDay()]+" · "+d.getDate()+" "+MON[d.getMonth()];
}
clockTick(); setInterval(clockTick,1000);
function lsn(){var n=new Date(),blk=Math.floor(n.getTime()/300000);
 var x=Math.sin(blk*12.9898)*43758.5453;x=x-Math.floor(x);
 var h=ist().getHours();
 var base=(h>=19&&h<=23)?520:((h>=7&&h<=10)?380:((h>=0&&h<=5)?110:300));
 var v=Math.floor(base+x*260); if(v>969)v=969; if(v<47)v=47;
 $("#lc").textContent=v.toLocaleString("en-IN")}
lsn();setInterval(lsn,30000);
function tabs(){var el=$("#tabs");el.innerHTML="";
 R.forEach(function(r){
  var n=r.tag?songs.filter(function(s){return (s.tags||[]).indexOf(r.tag)>-1}).length:songs.length;
  var b=document.createElement("button");b.className="tab";b.type="button";b.textContent=r.label;
  b.setAttribute("aria-pressed",String(r.id===rot));
  if(n===0)b.disabled=true;
  b.onclick=function(){rot=r.id;tabs();build();if(live)go(0)};
  el.appendChild(b)})}
fetch("songs.json",{cache:"no-store"}).then(function(r){return r.json()})
 .then(function(d){songs=(Array.isArray(d)?d:[]).filter(function(s){return s&&s.id});tabs();build()})
 .catch(function(){tabs();build()});
function build(){var r=R.filter(function(x){return x.id===rot})[0];
 q=r&&r.tag?songs.filter(function(s){return (s.tags||[]).indexOf(r.tag)>-1}):songs.slice();
 for(var k=q.length-1;k>0;k--){var j=Math.random()*(k+1)|0;var t=q[k];q[k]=q[j];q[j]=t}
