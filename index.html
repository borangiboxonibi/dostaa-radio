<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ದೋಸ್ತಾ ರೇಡಿಯೋ — ಕನ್ನಡ ಹಾಡುಗಳು</title>
<meta name="theme-color" content="#120A03"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--w:#FFF6E6;--w70:rgba(255,246,230,.7);--w45:rgba(255,246,230,.45);
--w22:rgba(255,246,230,.22);--w12:rgba(255,246,230,.12);
--gold:#FFC24A;--ember:#E24A22;
--kn:"Baloo Tamma 2",system-ui,sans-serif;--ui:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--ui);color:var(--w);overflow:hidden;
background:#120A03 url("bg-mobile.png") center/cover no-repeat fixed}
@media(min-width:760px){body{background-image:url("bg-desktop.png")}}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(85% 55% at 50% 42%,rgba(10,5,1,.72),transparent 72%),
linear-gradient(to bottom,rgba(10,5,1,.62) 0%,transparent 26%,transparent 60%,rgba(10,5,1,.8) 100%)}
.yt{position:fixed;bottom:-9999px;left:0;width:1px;height:1px;overflow:hidden}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
align-items:center;padding:max(14px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom))}
.top{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:9px}
.mark{font-family:var(--kn);font-weight:800;font-size:clamp(19px,4.4vw,28px);
line-height:1;color:#FFFBF2;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.mark em{font-style:normal;color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.2em;
text-transform:uppercase;color:var(--w70);background:rgba(10,5,1,.4);
border:1px solid var(--w12);border-radius:999px;padding:5px 12px;backdrop-filter:blur(10px)}
.chip i{width:5px;height:5px;border-radius:50%;background:var(--ember);
box-shadow:0 0 9px var(--ember);animation:blip 2.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.22}}
.deck{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;
justify-content:center;position:relative;padding:14px 0}
.platter{position:relative;width:min(74vw,54vh,330px);height:min(74vw,54vh,330px)}
.disc{position:absolute;inset:0;border-radius:50%;
background:repeating-radial-gradient(circle at 50% 50%,rgba(255,246,230,.045) 0 1px,transparent 1px 4px),
radial-gradient(circle at 50% 50%,#241608 0 33%,#140C05 34%,#0B0603 100%);
box-shadow:0 26px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,246,230,.09) inset;
animation:spin 3.4s linear infinite;animation-play-state:paused}
body.on-air .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;
background:conic-gradient(from 210deg,transparent 0deg,rgba(255,246,230,.13) 24deg,
transparent 62deg,transparent 190deg,rgba(255,246,230,.09) 218deg,transparent 258deg)}
.label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
width:38%;height:38%;border-radius:50%;overflow:hidden;background:#8C3A16;
display:grid;place-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 6px 18px rgba(0,0,0,.5)}
.label img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.label img.on{opacity:1}
.label .glyph{position:absolute;font-size:20px;color:rgba(255,246,230,.55)}
.spindle{position:absolute;left:50%;top:50%;width:9px;height:9px;
transform:translate(-50%,-50%);border-radius:50%;background:#0B0603;
box-shadow:0 0 0 2px rgba(255,246,230,.16);z-index:3}
.arm{position:absolute;right:-2%;top:4%;width:46%;height:56%;
transform-origin:92% 8%;transform:rotate(-26deg);
transition:transform .9s cubic-bezier(.4,.1,.2,1);pointer-events:none}
body.on-air .arm{transform:rotate(4deg)}
.arm-pivot{position:absolute;right:0;top:0;width:22px;height:22px;border-radius:50%;
background:linear-gradient(150deg,#6A5747,#2B2018);
box-shadow:0 3px 8px rgba(0,0,0,.6),0 0 0 1px rgba(255,246,230,.12)}
.arm-rod{position:absolute;right:9px;top:10px;width:3px;height:82%;
transform-origin:top;transform:rotate(28deg);
background:linear-gradient(to bottom,#C9BBA9,#7C6C59);border-radius:2px}
.arm-head{position:absolute;right:-8px;bottom:14%;width:15px;height:9px;
border-radius:2px;background:#D8CBB8;transform:rotate(28deg)}
.info{flex:0 0 auto;width:min(520px,100%);text-align:center}
.t{font-family:var(--kn);font-weight:700;font-size:clamp(19px,5.2vw,27px);line-height:1.2;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.s{margin-top:5px;font-size:12px;color:var(--w45);white-space:nowrap;
overflow:hidden;text-overflow:ellipsis}
.pg{margin-top:14px;padding:7px 0;cursor:pointer}
.track{position:relative;height:3px;background:var(--w12);border-radius:3px}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;
background:linear-gradient(90deg,var(--ember),var(--gold));transition:width .9s linear}
.knob{position:absolute;top:50%;left:0;width:10px;height:10px;border-radius:50%;
background:var(--w);transform:translate(-50%,-50%) scale(0);transition:left .9s linear,transform .18s}
.pg:hover .knob,body.on-air .knob{transform:translate(-50%,-50%) scale(1)}
.tm{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;
color:var(--w45);font-variant-numeric:tabular-nums}
.btns{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.b{border:0;background:transparent;color:var(--w);cursor:pointer;display:grid;
place-items:center;border-radius:50%;transition:opacity .12s}
.b:active{opacity:.5}
.b svg{fill:currentColor;display:block}
.b-sm{width:38px;height:38px}.b-sm svg{width:17px;height:17px}
.b-sm[aria-pressed=false]{color:var(--w22)}
.b-md{width:44px;height:44px}.b-md svg{width:23px;height:23px}
.b-lg{width:62px;height:62px;background:var(--w);color:#170D04;
box-shadow:0 8px 26px rgba(0,0,0,.55);transition:transform .14s}
.b-lg:active{transform:scale(.9)}
.b-lg svg{width:26px;height:26px}
.b:focus-visible{outline:2.5px solid var(--gold);outline-offset:3px}
.tabs{flex:0 0 auto;display:flex;gap:18px;margin-top:14px;padding-top:11px;
border-top:1px solid rgba(255,246,230,.08);overflow-x:auto;scrollbar-width:none;
justify-content:center;width:min(560px,100%)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;cursor:pointer;
font-family:var(--kn);font-weight:600;font-size:14px;color:var(--w22);
padding:2px 0 5px;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s}
.tab:hover{color:var(--w70)}
.tab[aria-pressed=true]{color:var(--w);border-bottom-color:var(--gold)}
.tab[disabled]{opacity:.32;cursor:not-allowed}
.foot{flex:0 0 auto;margin-top:9px;font-size:9px;color:rgba(255,246,230,.28);text-align:center}
.foot a{color:rgba(255,194,74,.5)}
@media(max-height:520px){.mark{display:none}}
@media(prefers-reduced-motion:reduce){.disc,.chip i{animation:none!important}.arm{transition:none}}
</style>
</head>
<body>
<div class="yt"><div id="yt"></div></div>
<div class="stage">
<div class="top">
<div class="mark">ದೋಸ್ತಾ <em>ರೇಡಿಯೋ</em></div>
<span class="chip"><i></i><span id="cnt">on air</span></span>
</div>
<div class="deck"><div class="platter">
<div class="disc"></div>
<div class="sheen"></div>
<div class="label" id="label"><span class="glyph">&#9834;</span><img id="cover" alt=""/></div>
<div class="spindle"></div>
<div class="arm"><div class="arm-rod"></div><div class="arm-head"></div><div class="arm-pivot"></div></div>
</div></div>
<div class="info">
<div class="t" id="t">ಪ್ಲೇ ಒತ್ತಿ</div>
<div class="s" id="s">ಕನ್ನಡ ಹಾಡುಗಳ ರೇಡಿಯೋ</div>
<div class="pg" id="pg"><div class="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div></div>
<div class="tm"><span id="t0">0:00</span><span id="t1">0:00</span></div>
<div class="btns">
<button class="b b-sm" id="shuf" aria-pressed="true" aria-label="shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8.5h-2.2c-1 0-1.6.4-2.3 1.4l-1 1.5-1.2-1.8.8-1.2C12.1 6.7 13.3 6 15 6h2V3zM3 6h3.2c1.7 0 2.9.7 3.9 2.2l4 6c.7 1 1.3 1.4 2.3 1.4H21v2.9h-4.6c-1.7 0-2.9-.7-3.9-2.2l-4-6C7.8 9.3 7.2 8.9 6.2 8.9H3V6zm14 9.5V13l4 4-4 4v-2.5h-1v-3h1z"/></svg></button>
<button class="b b-md" id="prev" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M7 6h2.2v12H7zM20 6v12l-9-6z"/></svg></button>
<button class="b b-lg" id="play" aria-label="play"><svg id="pi" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
<button class="b b-md" id="next" aria-label="next"><svg viewBox="0 0 24 24"><path d="M14.8 6H17v12h-2.2zM4 6l9 6-9 6z"/></svg></button>
<button class="b b-sm" id="rep" aria-pressed="false" aria-label="repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v2.5l4-3.5-4-3.5V5H5v6h2V7zm10 10H7v-2.5l-4 3.5 4 3.5V19h12v-6h-2v4z"/></svg></button>
</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="foot">YouTube ಮೂಲಕ ಪ್ಲೇ &middot; ಹಕ್ಕುಗಳು ಸಂಬಂಧಿತ ಸಂಸ್ಥೆಗಳಿಗೆ &middot; <a href="mailto:hello@dostaa.in">hello@dostaa.in</a> &middot; Dostaa</div>
</div>
<script>
var R=[{id:"all",label:"ಎಲ್ಲಾ"},{id:"classic",label:"ಹಳೆಯ ಚಿನ್ನ",tag:"classic"},
{id:"melody",label:"ಮಧುರ",tag:"melody"},{id:"dard",label:"ದುಃಖ",tag:"dard"},
{id:"mass",label:"ಮಾಸ್",tag:"mass"},{id:"folk",label:"ಜಾನಪದ",tag:"folk"}];
var $=function(s){return document.querySelector(s)};
var songs=[],q=[],i=0,pl=null,rdy=false,live=false,rot="all",tick=null;
var shuffle=true,repeatOne=false;
var PLAY='<path d="M8 5v14l11-7z"/>';
var PAUSE='<path d="M6.5 5h3.6v14H6.5zM13.9 5h3.6v14h-3.6z"/>';
function tabs(){var el=$("#tabs");el.innerHTML="";
R.forEach(function(r){
var n=r.tag?songs.filter(function(s){return (s.tags||[]).indexOf(r.tag)>-1}).length:songs.length;
var b=document.createElement("button");b.className="tab";b.type="button";b.textContent=r.label;
b.setAttribute("aria-pressed",String(r.id===rot));
if(n===0){b.disabled=true}
b.onclick=function(){rot=r.id;tabs();build();if(live)go(0)};
el.appendChild(b)})}
fetch("songs.json",{cache:"no-store"}).then(function(r){return r.json()})
.then(function(d){songs=(Array.isArray(d)?d:[]).filter(function(s){return s&&s.id});tabs();build()})
.catch(function(){tabs();build()});
function build(){var r=R.filter(function(x){return x.id===rot})[0];
q=r&&r.tag?songs.filter(function(s){return (s.tags||[]).indexOf(r.tag)>-1}):songs.slice();
if(shuffle){for(var k=q.length-1;k>0;k--){var j=Math.random()*(k+1)|0;var t=q[k];q[k]=q[j];q[j]=t}}
else{q.sort(function(a,b){return (a.year||0)-(b.year||0)})}
i=0}
window.onYouTubeIframeAPIReady=function(){
pl=new YT.Player("yt",{height:"1",width:"1",
playerVars:{playsinline:1,rel:0,controls:0,disablekb:1,modestbranding:1},
events:{onReady:function(){rdy=true;if(live)go(i)},
onStateChange:function(e){var on=e.data===YT.PlayerState.PLAYING;
document.body.classList.toggle("on-air",on);
$("#pi").innerHTML=on?PAUSE:PLAY;
if(on){start()}else{stop()}
if(e.data===YT.PlayerState.ENDED){repeatOne?go(i):go(i+1)}},
onError:function(){go(i+1)}}})};
(function(){var s=document.createElement("script");
s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)})();
function go(k){if(!q.length)return;
i=(k+q.length)%q.length;live=true;var s=q[i];
$("#t").textContent=s.title||"";
$("#s").textContent=[s.film,s.year,s.singers].filter(Boolean).join(" \u00b7 ");
var img=$("#cover");img.classList.remove("on");
img.onload=function(){img.classList.add("on")};
img.src="https://i.ytimg.com/vi/"+s.id+"/mqdefault.jpg";
$("#fill").style.width="0";$("#knob").style.left="0";
$("#t0").textContent="0:00";$("#t1").textContent="0:00";
if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata(
{title:s.title||"",artist:s.singers||"Dostaa Radio",album:s.film||"",
artwork:[{src:"https://i.ytimg.com/vi/"+s.id+"/hqdefault.jpg",sizes:"480x360",type:"image/jpeg"}]})}
if(rdy&&pl)pl.loadVideoById(s.id)}
function fmt(x){x=Math.floor(x||0);
return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
function start(){stop();tick=setInterval(function(){
if(!pl||!rdy)return;
var c=pl.getCurrentTime()||0,d=pl.getDuration()||0,p=d?c/d*100:0;
$("#fill").style.width=p+"%";$("#knob").style.left=p+"%";
$("#t0").textContent=fmt(c);$("#t1").textContent=fmt(d)},1000)}
function stop(){clearInterval(tick);tick=null}
$("#pg").onclick=function(e){if(!pl||!rdy||!live)return;
var r=$("#pg").querySelector(".track").getBoundingClientRect();
pl.seekTo((e.clientX-r.left)/r.width*(pl.getDuration()||0),true)};
$("#play").onclick=function(){if(!q.length)return;
if(!live){go(i);return}
pl.getPlayerState()===YT.PlayerState.PLAYING?pl.pauseVideo():pl.playVideo()};
$("#next").onclick=function(){go(i+1)};
$("#prev").onclick=function(){
if(pl&&rdy&&live&&(pl.getCurrentTime()||0)>3){pl.seekTo(0,true);return}
go(i-1)};
$("#shuf").onclick=function(e){shuffle=!shuffle;
e.currentTarget.setAttribute("aria-pressed",String(shuffle));
var cur=q[i];build();
if(cur){var at=-1;for(var z=0;z<q.length;z++){if(q[z].id===cur.id){at=z;break}}if(at>-1)i=at}};
$("#rep").onclick=function(e){repeatOne=!repeatOne;
e.currentTarget.setAttribute("aria-pressed",String(repeatOne))};
addEventListener("keydown",function(e){
if(e.target.matches("button"))return;
if(e.code==="Space"){e.preventDefault();$("#play").click()}
if(e.code==="ArrowRight")go(i+1);
if(e.code==="ArrowLeft")$("#prev").click()});
</script>
</body>
</html>
